{% extends "base.html" %}
{% block content %}
<section class="home">
    <h1 class="home-title">Find fashion products</h1>
    <p class="home-sub">{{ "{:,}".format(n_products) }} products: clothing, footwear and accessories.</p>
    <form class="home-form" method="GET" action="{{ url_for('search') }}" role="search">
        <div class="search-box">
            <input class="form-control search-input" name="q" type="search" placeholder="e.g. black running shoes for men"
                   aria-label="Search products" autofocus required>
            <button class="btn btn-primary search-button" type="submit">Search</button>
        </div>
        <div class="home-options">
            <label for="method">Ranking</label>
            <select id="method" name="method" class="custom-select custom-select-sm">
                {% for m in methods %}<option value="{{ m }}">{{ method_names[m] }}</option>{% endfor %}
            </select>
        </div>
    </form>
    <div class="examples">
        <span>Try:</span>
        {% for q in examples %}
            <a class="chip" href="{{ url_for('search', q=q) }}">{{ q }}</a>
        {% endfor %}
    </div>
</section>
{% endblock %}
